# === General Settings ===
set -g mouse on                  # Enable mouse support
set -g history-limit 10000        # Increase scrollback history
set -g status-keys vi             # Use Vim-style key bindings in the status line
setw -g mode-keys vi              # Use Vim-style keys in copy mode
set -g renumber-windows on        # Automatically renumber windows after closing one
set -g focus-events on            # Enable focus events for better terminal integration
set -g escape-time 10             # Reduce delay for key sequences
set -g terminal-overrides ",xterm-256color:Tc"  # Fix colors in some terminals

# === Appearance ===
set -g status on
set -g status-bg black            # Status bar background color
set -g status-fg white            # Status bar text color

# Display session name, time, and active pane info
set -g status-left "#[bold]Session: #S #[fg=yellow]#(tmux display-message -p '#{client_mode}') #[default]"
set -g status-right "#[fg=cyan]Pane: #[bold]#P #[fg=yellow]Mode: #{pane_mode} | #[fg=magenta]%I:%M %p %d-%b"

# Window formatting
setw -g window-status-format "#[fg=cyan]#I:#[default]#W"   # Default inactive window
setw -g window-status-current-format "#[bold][#I:#W]"      # Highlight active window
set -g pane-border-status top                              # Show pane titles
set -g pane-active-border-style "fg=green bold"           # Green for active pane
set -g pane-border-style "fg=white"                       # White for inactive panes

# === Key Bindings ===
unbind C-b                        # Unbind default prefix
set -g prefix C-a                 # Use Ctrl-a as the prefix key
bind C-a send-prefix              # Allow sending Ctrl-a to applications

# Pane Management
bind | split-window -h            # Split pane horizontally
bind - split-window -v            # Split pane vertically
unbind '"'                        
unbind %                         

# Pane Navigation
bind h select-pane -L             # Move left
bind j select-pane -D             # Move down
bind k select-pane -U             # Move up
bind l select-pane -R             # Move right

# Resize Panes
bind -r H resize-pane -L 5        # Resize left
bind -r J resize-pane -D 5        # Resize down
bind -r K resize-pane -U 5        # Resize up
bind -r L resize-pane -R 5        # Resize right

# Reload Configuration
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

# === Window & Session Management ===
bind c new-window                # Create a new window
bind w choose-window             # List all windows
bind n next-window               # Move to next window
bind p previous-window           # Move to previous window
bind & kill-window               # Close the current window
bind x kill-pane                 # Close the current pane

# === Clipboard Integration for macOS ===
set-option -g set-clipboard on  # Ensure tmux integrates with the system clipboard

# Copy mode (Vim-style)
unbind [
bind [ copy-mode                 # Ensure `Ctrl-a [` enters copy mode

# Copy text with `y` and send it to macOS clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard"

# === Plugin Support ===
# First clone the following git repo:
#     git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then, inside tmux, press Ctrl + A + I  # Install plugins, Ctrl + a is new bind key
# In remote machine after copying some text inside tmux, to send it to local machine:
#     `tmux show-buffer | xclip -selection clipboard` 
set -g @plugin 'tmux-plugins/tmux-yank'   # Clipboard plugin
run '~/.tmux/plugins/tpm/tpm'             # Run tmux plugin manager (TPM)

# === Miscellaneous ===
set -g status-interval 1              # Refresh status every second
set -g automatic-rename on            # Automatically rename windows
set -g pane-border-status top         # Show pane title on top
setw -g monitor-activity on           # Highlight activity in windows

