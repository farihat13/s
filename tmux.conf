# === General Settings ===
set -g mouse on                  # Enable mouse support
set -g history-limit 10000        # Increase scrollback history
set -g status-keys vi             # Use Vim-style key bindings in the status line
setw -g mode-keys vi              # Use Vim-style keys in copy mode
set -g renumber-windows on        # Automatically renumber windows after closing one
set -g focus-events on            # Enable focus events for better terminal integration
set -g escape-time 10             # Reduce delay for key sequences
set -g terminal-overrides ",xterm-256color:Tc"  # Fix colors in some terminals

# === Appearance ===
# Soft dark-gray base with a green accent. Plain ASCII only, so it stays
# readable over SSH / on terminals without a Nerd Font.
set -g status on
set -g status-justify left
set -g status-style "bg=colour236,fg=colour245"

# Left: session name in a green block, then a PREFIX flag while the prefix is held.
# status-left-length defaults to 10 (which truncated the old "Session: NAME"),
# so give it real room.
set -g status-left-length 40
set -g status-left "#[fg=colour236,bg=colour114,bold] #S #[fg=colour114,bg=colour236,nobold] #{?client_prefix,#[fg=colour236#,bg=colour215#,bold] PREFIX #[default],}"

# Right: SYNC warning when panes are synchronized, then host and date/time.
set -g status-right-length 80
set -g status-right "#{?pane_synchronized,#[fg=colour236#,bg=colour203#,bold] SYNC #[default] ,}#[fg=colour109]#H #[fg=colour114,bold]%I:%M %p #[fg=colour245]%d-%b "

# Window list: active window in a green block, others dim; a dot marks activity.
setw -g window-status-format "#[fg=colour245] #I:#W#{?window_activity_flag, *,} "
setw -g window-status-current-format "#[fg=colour236,bg=colour114,bold] #I:#W "
setw -g window-status-separator ""

# Panes: titles on top showing the running command; green active border.
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_current_command} "
set -g pane-active-border-style "fg=colour114,bold"       # Green for active pane
set -g pane-border-style "fg=colour240"                   # Dim gray for inactive panes

# Command prompt and copy-mode selection use the same green accent.
set -g message-style "bg=colour114,fg=colour236,bold"
set -g mode-style "bg=colour114,fg=colour236"

# === Key Bindings ===
unbind C-b                        # Unbind default prefix
set -g prefix C-a                 # Use Ctrl-a as the prefix key
bind C-a send-prefix              # Allow sending Ctrl-a to applications

# Pane Management
bind | split-window -h            # Split pane horizontally
bind - split-window -v            # Split pane vertically
unbind '"'                        
unbind %   
# Bind Prefix + s to turn sync ON
bind s setw synchronize-panes on \; display-message "Sync Panes: ON"
# Bind Prefix + S (Shift+s) to turn sync OFF
bind S setw synchronize-panes off \; display-message "Sync Panes: OFF"

# Pane Navigation
bind h select-pane -L             # Move left
bind j select-pane -D             # Move down
bind k select-pane -U             # Move up
bind l select-pane -R             # Move right

# Resize Panes
bind -r H resize-pane -L 5        # Resize left
bind -r J resize-pane -D 5        # Resize down
bind -r K resize-pane -U 5        # Resize up
bind -r L resize-pane -R 5        # Resize right

# Reload Configuration
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

# === Window & Session Management ===
bind c new-window                # Create a new window
bind w choose-window             # List all windows
bind n next-window               # Move to next window
bind p previous-window           # Move to previous window
bind & kill-window               # Close the current window
bind x kill-pane                 # Close the current pane

# === Clipboard Integration (macOS + Linux, over SSH) ===
# set-clipboard forwards copy-mode selections to the terminal's clipboard via
# OSC52 — works on any OSC52-capable terminal (iTerm2, most Linux terminals).
# Apple Terminal.app does NOT support OSC52; use iTerm2 there if you need copy.
set-option -g set-clipboard on

# === Miscellaneous ===
set -g status-interval 5              # Refresh status (clock) every 5s
set -g automatic-rename on            # Automatically rename windows
setw -g monitor-activity on           # Highlight activity in windows
set-option -g aggressive-resize on    # Resize panes to fit the terminal
